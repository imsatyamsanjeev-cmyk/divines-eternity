<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Premium Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5c8" />
      <stop offset="50%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#9a7b3c" />
    </linearGradient>
  </defs>
  
  <!-- Outer Decorative Ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" opacity="0.4"/>
  
  <!-- Intertwined Infinity & Rose Emblem -->
  <g transform="translate(0, -1)">
    <!-- Infinity Loop (Bottom half of logo artwork) -->
    <path d="M 32 58 C 22 58, 22 42, 32 42 C 40 42, 44 50, 50 50 C 56 50, 60 42, 68 42 C 78 42, 78 58, 68 58 C 60 58, 56 50, 50 50 C 44 50, 40 58, 32 58 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          
    <!-- Minimalist Rose Outline (Top half of logo artwork) -->
    <g transform="translate(50, 42) scale(0.7)">
      <!-- Rose Stem & Leaves -->
      <path d="M 0 0 C 0 -10, -5 -15, -12 -12" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
      <path d="M -12 -12 C -20 -9, -15 -25, 0 -30" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Leaf 1 -->
      <path d="M -5 -7 C -12 -3, -13 -9, -5 -7" fill="url(#goldGrad)" opacity="0.8"/>
      <!-- Leaf 2 -->
      <path d="M 5 -12 C 12 -15, 10 -9, 5 -12" fill="url(#goldGrad)" opacity="0.8"/>
      
      <!-- Petals layers (abstract curves) -->
      <path d="M -8 -30 C -15 -45, 15 -45, 8 -30" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
      <path d="M -12 -33 C -20 -15, 20 -15, 12 -33" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round"/>
      
      <!-- Inner bud spiral -->
      <path d="M 0 -34 A 4 4 0 1 1 -0.1 -34" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
      <path d="M -2 -34 C -1 -38, 2 -38, 1 -34" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <!-- Sparkles -->
    <path d="M 28 32 L 30 35 L 33 36 L 30 37 L 28 40 L 26 37 L 23 36 L 26 35 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <path d="M 72 34 L 73 36 L 75 37 L 73 38 L 72 40 L 71 38 L 69 37 L 71 36 Z" fill="url(#goldGrad)" opacity="0.8" transform="scale(0.8) translate(20, 10)"/>
  </g>
</svg>
